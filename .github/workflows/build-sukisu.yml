name: Build SukiSU + SUSFS Kernel (lisa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      SUBARCH: arm64
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      # ======================
      # DEPENDENCIES
      # ======================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl zip unzip build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            flex bison bc libssl-dev libelf-dev python3 \
            ccache rsync

      # ======================
      # CCACHE SETUP (RESTORE)
      # ======================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-lisa-${{ github.sha }}
          restore-keys: |
            ccache-lisa-

      - name: Configure ccache
        run: |
          ccache --version
          ccache --max-size=$CCACHE_MAXSIZE
          ccache --set-config=compression=true
          ccache --set-config=sloppiness=file_macro,time_macros
          ccache -z

      # ======================
      # KERNEL SOURCE (YOUR FORK)
      # ======================
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/heisdezz/android_kernel_xiaomi_sm8350 \
            -b lineage-23.2 \
            kernel

      # ======================
      # CLANG TOOLCHAIN
      # ======================
      - name: Setup clang
        run: |
          git clone --depth=1 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
            clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      # ======================
      # SUKISU - official setup.sh handles symlink + Makefile/Kconfig patching
      # ======================
      - name: Setup SukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | sh -s builtin

      # ======================
      # SUSFS - kernel-5.4 branch for SM8350/lahaina
      # ======================
      - name: Clone and apply SUSFS
        run: |
          git clone --depth=1 \
            -b kernel-5.4 \
            https://gitlab.com/simonpunk/susfs4ksu \
            susfs

          cd kernel

          # Apply the main kernel patch
          echo "==> Applying SUSFS patch..."
          patch -p1 --forward < ../susfs/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

          # Copy SUSFS source files
          cp -r ../susfs/kernel_patches/fs/* fs/ || true
          cp -r ../susfs/kernel_patches/include/linux/* include/linux/ || true

          # Ensure task_mmu.c includes susfs.h — the patch sometimes misses this
          # on vendor-modified 5.4 kernels, causing INODE_STATE_SUS_KSTAT undeclared
          if ! grep -q "susfs.h" fs/proc/task_mmu.c; then
            echo "==> Injecting susfs.h include into fs/proc/task_mmu.c"
            sed -i '/#include <linux\/mm.h>/a #include <linux/susfs.h>' fs/proc/task_mmu.c
          fi

      # ======================
      # ANYKERNEL
      # ======================
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            anykernel
          sed -i 's/^device.name1=.*/device.name1=lisa/' anykernel/anykernel.sh
          sed -i 's/^supported.versions=.*/supported.versions=12-/' anykernel/anykernel.sh

      # ======================
      # CONFIG
      # ======================
      - name: Configure kernel
        run: |
          cd kernel
          mkdir -p out

          # Cat the three config fragments into out/.config
          cat arch/arm64/configs/vendor/lahaina-qgki_defconfig \
              arch/arm64/configs/vendor/debugfs.config \
              arch/arm64/configs/vendor/xiaomi_QGKI.config \
              > out/.config

          # First olddefconfig pass: resolve fragment conflicts
          make -C $(pwd) O=$(pwd)/out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          # Enable KSU + SUSFS options
          # KALLSYMS is required for non-GKI (GKI 1.0 / 5.4) root to work
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS

          # Second olddefconfig pass: resolve KSU/SUSFS dependencies
          make -C $(pwd) O=$(pwd)/out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # ======================
      # BUILD
      # stderr goes to both console and a log file so errors survive
      # the 4000-line flood of CC lines
      # ======================
      - name: Build kernel
        run: |
          cd kernel
          make -C $(pwd) O=$(pwd)/out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc) 2>&1 | tee ../build.log
          # Re-exit with failure if make failed (tee masks the exit code)
          grep -qE "^make(\[.*\])?: \*\*\*" ../build.log && exit 1 || true

      # ======================
      # SHOW BUILD ERRORS (if any)
      # ======================
      - name: Show build errors
        if: failure()
        run: |
          echo "=== All errors and warnings ==="
          grep -E " error:|warning:" build.log | head -80 || true
          echo "=== Last 60 lines ==="
          tail -60 build.log || true

      # ======================
      # CCACHE STATS
      # ======================
      - name: Show ccache stats
        run: ccache -s

      # ======================
      # PACKAGE
      # ======================
      - name: Package kernel
        run: |
          mkdir -p release
          cp kernel/out/arch/arm64/boot/Image anykernel/
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi
          cd anykernel
          zip -r9 ../release/SukiSU-SUSFS-lisa.zip .

      # ======================
      # UPLOAD
      # ======================
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: suksu-susfs-kernel
          path: release/

      # ======================
      # UPLOAD BUILD LOG (always, for debugging)
      # ======================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
