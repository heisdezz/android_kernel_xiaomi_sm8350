name: Build SukiSU + SUSFS Kernel (lisa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      SUBARCH: arm64
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      # ======================
      # DEPENDENCIES
      # ======================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl zip unzip build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            flex bison bc libssl-dev libelf-dev python3 \
            ccache rsync

      # ======================
      # CCACHE SETUP (RESTORE)
      # ======================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-lisa-${{ github.sha }}
          restore-keys: |
            ccache-lisa-

      - name: Configure ccache
        run: |
          ccache --version
          ccache --max-size=$CCACHE_MAXSIZE
          ccache --set-config=compression=true
          ccache --set-config=sloppiness=file_macro,time_macros
          ccache -z

      # ======================
      # KERNEL SOURCE (YOUR FORK)
      # ======================
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/heisdezz/android_kernel_xiaomi_sm8350 \
            -b lineage-23.2 \
            kernel

      # ======================
      # CLANG TOOLCHAIN
      # ======================
      - name: Setup clang
        run: |
          # Use a standalone Clang build — much faster than cloning all AOSP prebuilts
          git clone --depth=1 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
            clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      # ======================
      # SUKISU
      # ======================
      - name: Clone SukiSU
        run: |
          git clone --depth=1 \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra \
            suksu

      # ======================
      # SUSFS — use 5.4 branch (lahaina/sm8350 is a 5.4 kernel, NOT 6.6)
      # ======================
      - name: Clone SUSFS
        run: |
          git clone --depth=1 \
            -b gki-android12-5.4 \
            https://gitlab.com/simonpunk/susfs4ksu \
            susfs

      # ======================
      # ANYKERNEL
      # ======================
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            anykernel

      # ======================
      # PATCHING
      # ======================
      - name: Apply patches
        run: |
          set -e
          cd kernel

          echo "==> Applying SukiSU..."
          cp -r ../suksu/kernel/* . || true

          echo "==> Applying SUSFS..."
          SUSFS_PATCH=$(find ../susfs/kernel_patches -name "*5.4*" | head -1)
          if [ -n "$SUSFS_PATCH" ]; then
            cp "$SUSFS_PATCH" .
            patch -p1 --forward < "$(basename $SUSFS_PATCH)" || true
          else
            echo "Warning: no 5.4 SUSFS patch found, skipping"
          fi

          cp -r ../susfs/kernel_patches/fs/* fs/ || true
          cp -r ../susfs/kernel_patches/include/linux/* include/linux/ || true

      # ======================
      # CONFIG
      # The real defconfig for lisa (sm8350) is lahaina-qgki_defconfig
      # combined with xiaomi_QGKI.config — not lisa_QGKI_defconfig
      # ======================
      - name: Configure kernel
        run: |
          cd kernel

          export CC="ccache clang"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/lahaina-qgki_defconfig vendor/xiaomi_QGKI.config

          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS

          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # ======================
      # BUILD
      # ======================
      - name: Build kernel
        run: |
          cd kernel
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc)

      # ======================
      # CCACHE STATS
      # ======================
      - name: Show ccache stats
        run: ccache -s

      # ======================
      # PACKAGE
      # ======================
      - name: Package kernel
        run: |
          mkdir -p release
          cp kernel/out/arch/arm64/boot/Image anykernel/
          # Include DTBs if present
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi
          cd anykernel
          zip -r9 ../release/SukiSU-SUSFS-lisa.zip .

      # ======================
      # UPLOAD
      # ======================
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: suksu-susfs-kernel
          path: release/
