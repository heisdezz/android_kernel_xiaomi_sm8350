name: Build Kernel with KernelSU Next

on:
  push:
    branches:
      - lineage-23.2
  pull_request:
    branches:
      - lineage-23.2
  workflow_dispatch:
    inputs:
      ksun_branch:
        description: "KernelSU Next branch/tag"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - dev
          - legacy
      upload_release:
        description: "Create GitHub Release"
        required: false
        default: false
        type: boolean

env:
  # Kernel / device config
  DEVICE:          lisa
  ARCH:            arm64
  DEFCONFIG:       vendor/lahaina-qgki_defconfig
  KERNEL_BRANCH:   lineage-23.2

  # Toolchain
  CLANG_VERSION:   clang-r416183b
  CLANG_URL:       https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  CROSS_COMPILE:   aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

  # Build output
  OUT_DIR:         ${{ github.workspace }}/out

jobs:
  build:
    name: Build Kernel (${{ github.event.inputs.ksun_branch || 'stable' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ─── 1. Checkout kernel source ───────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      # ─── 2. Install build dependencies ───────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex \
            gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libelf-dev libssl-dev lz4 make ninja-build \
            python3 python3-pip zip zstd

      # ─── 3. Cache Clang toolchain ─────────────────────────────────────────────
      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain/clang
          key: clang-${{ env.CLANG_VERSION }}-v1

      - name: Download Clang toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/toolchain/clang
          git clone --depth=1 \
            --filter=blob:none \
            --sparse \
            ${{ env.CLANG_URL }} \
            ${{ github.workspace }}/toolchain/clang-repo
          cd ${{ github.workspace }}/toolchain/clang-repo
          git sparse-checkout set ${{ env.CLANG_VERSION }}
          cp -r ${{ env.CLANG_VERSION }}/* ${{ github.workspace }}/toolchain/clang/

      # ─── 4. Integrate KernelSU Next ──────────────────────────────────────────
      - name: Integrate KernelSU Next
        run: |
          KSUN_BRANCH="${{ github.event.inputs.ksun_branch || 'stable' }}"
          echo "Integrating KernelSU Next (${KSUN_BRANCH})..."

          if [ "$KSUN_BRANCH" = "stable" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
              | bash -s stable
          elif [ "$KSUN_BRANCH" = "dev" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
              | bash -s dev
          elif [ "$KSUN_BRANCH" = "legacy" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
              | bash -s legacy
          else
            # Treat as a specific tag e.g. v3.0.0
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
              | bash -s "$KSUN_BRANCH"
          fi

          # Print KSU version for logging
          if [ -f "KernelSU/kernel/Makefile" ]; then
            grep "^KSUVER" KernelSU/kernel/Makefile || true
          fi

      # ─── 5. Set up build environment ─────────────────────────────────────────
      - name: Set up build environment
        run: |
          CLANG_BIN="${{ github.workspace }}/toolchain/clang/bin"
          echo "CLANG_BIN=${CLANG_BIN}" >> $GITHUB_ENV
          echo "${CLANG_BIN}" >> $GITHUB_PATH
          echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$(make kernelversion 2>/dev/null || echo 'unknown')" >> $GITHUB_ENV

      # ─── 6. Build kernel ──────────────────────────────────────────────────────
      - name: Build kernel
        run: |
          mkdir -p "${{ env.OUT_DIR }}"

          MAKE_FLAGS=(
            O="${{ env.OUT_DIR }}"
            ARCH="${{ env.ARCH }}"
            CC="${{ env.CLANG_BIN }}/clang"
            CLANG_TRIPLE="aarch64-linux-gnu-"
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}"
            CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}"
            LD="${{ env.CLANG_BIN }}/ld.lld"
            AR="${{ env.CLANG_BIN }}/llvm-ar"
            NM="${{ env.CLANG_BIN }}/llvm-nm"
            OBJCOPY="${{ env.CLANG_BIN }}/llvm-objcopy"
            OBJDUMP="${{ env.CLANG_BIN }}/llvm-objdump"
            STRIP="${{ env.CLANG_BIN }}/llvm-strip"
            LLVM=1
            LLVM_IAS=1
          )

          echo "==> Generating defconfig: ${{ env.DEFCONFIG }}"
          make "${MAKE_FLAGS[@]}" ${{ env.DEFCONFIG }}

          echo "==> Building kernel ($(nproc) threads)"
          make "${MAKE_FLAGS[@]}" -j$(nproc) 2>&1 | tee ${{ github.workspace }}/build.log

          # Verify the Image was produced
          if [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image" ]; then
            echo "ERROR: Kernel Image not found — build failed!"
            exit 1
          fi
          echo "==> Kernel Image built successfully"

      # ─── 7. Package with AnyKernel3 ──────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            ${{ github.workspace }}/AnyKernel3

          # Copy kernel image
          cp "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image" \
             ${{ github.workspace }}/AnyKernel3/

          # Copy DTBs if present
          DTB_DIR="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dts/vendor/qcom"
          if [ -d "$DTB_DIR" ]; then
            find "$DTB_DIR" -name "*.dtb" -exec cat {} + > \
              ${{ github.workspace }}/AnyKernel3/dtb
            echo "==> DTB merged"
          fi

          # Copy DTBO if present
          DTBO="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img"
          if [ -f "$DTBO" ]; then
            cp "$DTBO" ${{ github.workspace }}/AnyKernel3/
            echo "==> DTBO copied"
          fi

          # Patch AnyKernel3 config for lisa
          cd ${{ github.workspace }}/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=/device.name1=lisa/' anykernel.sh

          KSUN_LABEL="${{ github.event.inputs.ksun_branch || 'stable' }}"
          ZIP_NAME="KernelSU-Next_${KSUN_LABEL}_lisa_${{ env.BUILD_DATE }}.zip"
          zip -r9 "${{ github.workspace }}/${ZIP_NAME}" . \
            -x ".git/*" -x "*.md" -x "LICENSE" -x "*.txt"

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "==> Package: ${ZIP_NAME}"

      # ─── 8. Upload build artifacts ───────────────────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_DATE }}
          path: ${{ github.workspace }}/build.log
          retention-days: 7

      # ─── 9. Create GitHub Release (optional) ─────────────────────────────────
      - name: Create GitHub Release
        if: ${{ github.event.inputs.upload_release == 'true' && github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}
          name: "KernelSU Next (${{ github.event.inputs.ksun_branch || 'stable' }}) — ${{ env.BUILD_DATE }}"
          body: |
            ## Kernel build for Xiaomi Lisa (sm8350)

            | Field        | Value |
            |---|---|
            | **Device**   | Xiaomi 11 Lite 5G NE (lisa) |
            | **SoC**      | Snapdragon 778G (SM7325) |
            | **Branch**   | `${{ env.KERNEL_BRANCH }}` |
            | **KSU Next** | `${{ github.event.inputs.ksun_branch || 'stable' }}` |
            | **Commit**   | `${{ github.sha }}` |
            | **Date**     | ${{ env.BUILD_DATE }} |

            ### Flash instructions
            1. Boot into custom recovery (TWRP / OrangeFox)
            2. Flash the zip
            3. Reboot to system
            4. Install **KernelSU Next Manager** APK
          files: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
